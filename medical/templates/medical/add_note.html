{% extends 'base.html' %}

{% block content %}
<h1>Consultation Note</h1>
<p>{{ appointment.patient }} with {{ appointment.doctor }} on {{ appointment.date }} at {{ appointment.time_slot }}</p>

<form method="post">
    {% csrf_token %}
    {{ form.as_div }}
    <button type="submit">Save Note</button>
</form>
{% endblock %}
