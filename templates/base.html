<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block DocumentTitle %}{% endblock %}</title>
</head>
<body>
    <header>
        YourDoctorHere
    </header>
    {% if messages %}
    <section>
        {% for message in messages %}
        <p>{{ message }}</p>
        {% endfor %}
    </section>
    {% endif %}
    {% block content %}{% endblock %}
    <footer>

    </footer>
    {% block scripts %}{% endblock %}
</body>
</html>
